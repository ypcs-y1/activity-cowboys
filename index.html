<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaquero Downloads</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: #1f2937;
            padding: 40px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .download-btn {
            display: block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vaquero Downloads</h1>
        <p>Download the presentation files below.</p>

        <a class="download-btn" href="vequeros%20.mp4" download>
            Download Video (.mp4)
        </a>

        <a class="download-btn" href="Vequaeros.pdf" download>
            Download PDF
        </a>

        <a class="download-btn" href="Vaquero_Storybook_Presentation.pptx" download>
            Download PowerPoint
        </a>

        <footer>
            Hosted with GitHub Pages
        </footer>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaquero Downloads</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(31, 41, 55, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .download-btn {
            position: relative;
            display: block;
            text-decoration: none;
            color: white;
            padding: 18px;
            margin: 18px 0;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            overflow: hidden;
            transition: 0.25s ease;
            background: #2563eb;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* thin inside glow */
        .download-btn::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.25);
            pointer-events: none;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            background: #1d4ed8;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
        }

        .download-btn span {
            position: relative;
            z-index: 2;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .download-btn {
                font-size: 16px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Vaquero Downloads</h1>

        <p class="subtitle">
            Access the video, PDF, and PowerPoint presentation below.
        </p>

        <a class="download-btn"
           href="https://1drv.ms/v/c/c3ea321488f12b08/IQCTD8J5qVnuSZNnvEffDGqIAaRSaDo1-0f8_a7xwoU3Auc?e=vGV5a9"
           target="_blank">
            <span>🎬 Watch / Download Video</span>
        </a>

        <a class="download-btn"
           href="Vequaeros.pdf"
           download>
            <span>📄 Download PDF</span>
        </a>

        <a class="download-btn"
           href="Vaquero_Storybook_Presentation.pptx"
           download>
            <span>📊 Download PowerPoint</span>
        </a>

        <footer>
            Made by youssof 
        </footer>
    </div>

</body>
</html>
